name: Shared Sync Build

on:
  workflow_call:
    secrets:
      modrinth_token:
        required: true
      hangar_token:
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Update Modrinth Description
        run: gradle modrinthSyncBody --stacktrace
        env:
          MODRINTH_TOKEN: ${{ secrets.modrinth_token }}

      - name: Update Hangar Description
        run: gradle syncPluginPublicationMainResourcePagePageToHangar --stacktrace
        env:
          HANGAR_KEY: ${{ secrets.hangar_token }}