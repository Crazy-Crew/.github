name: Open Pull Request

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_SECRET_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "CrazyEnchantments,CrazyCrates,CrazyEnvoys,CrazyVouchers,CrazyAuctions,ChatManager,BlockParticles"

      - name: Checkout Local Repository
        uses: actions/checkout@v7

      - name: Checkout Parent Repository
        uses: actions/checkout@v7
        with:
          repository: Crazy-Crew/.github
          path: .github

      - uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Render template
        id: template
        uses: chuhlomin/render-template@v1.4
        with:
          template: .github/.github/request_opened.md
          vars:
            |
            user: ${{ github.event.pull_request.user.login }}
            project: ${{ github.repository }}

      - uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.template.outputs.result }}