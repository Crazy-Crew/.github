name: Reply Pull Request

on:
  workflow_call:
    secrets:
      app_secret_key:
        required: true
      app_id:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_secret_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout Parent Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: Crazy-Crew/.github
          sparse-checkout: .github/build_finished.md
          path: .github

      - name: Render template
        id: template
        uses: chuhlomin/render-template@v1.4
        with:
          template: .github/.github/build_finished.md
          vars:
            |
            user: ${{ github.event.issue.user.login }}
            link: ${{ vars.ARTIFACT_LINK }}

      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ vars.NEXT_BUILD_NUMBER }}
          comment-author: crazy-crew

      - uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ steps.generate-token.outputs.token }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ vars.NEXT_BUILD_NUMBER }}
          body: ${{ steps.template.outputs.result }}
          edit-mode: append