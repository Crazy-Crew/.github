name: Upload Artifact

on:
  workflow_call:
    inputs:
      label:
        required: true
        type: string
        default: "build"
      path:
        required: false
        type: string
        default: "build/libs"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    if: contains(github.event.pull_request.labels.*.name, inputs.label)

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: gradle build --stacktrace

      - name: Prepare build number
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh variable set NEXT_BUILD_NUMBER --body "${{ github.event.number }}" --repo "${{ github.repository }}"
          echo "NEXT_BUILD_NUMBER=${{ github.event.number }}" >> "$GITHUB_ENV"

      - name: Upload Plugin
        uses: actions/upload-artifact@v7
        with:
          path: ${{ inputs.path }}