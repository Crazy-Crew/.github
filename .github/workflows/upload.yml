name: Upload Artifact

on:
  workflow_call:
    inputs:
      label:
        required: true
        type: string
        default: "build"
      path:
        required: false
        type: string
        default: "build/libs"
      project:
        required: true
        type: string

    secrets:
      app_secret_key:
        required: true
      app_id:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    if: contains(github.event.pull_request.labels.*.name, inputs.label)

    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_secret_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: gradle build --stacktrace

      - name: Update Build Variable
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: gh variable set NEXT_BUILD_NUMBER --body "${{ github.event.number }}" --repo ${{ github.repository }}

      - name: Upload Plugin
        id: upload-plugin
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.project }}
          path: ${{ inputs.path }}
          retention-days: 3

      - name: Update Artifact Variable
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: gh variable set ARTIFACT_LINK --body "${{ steps.upload-plugin.outputs.artifact-url }}" --repo ${{ github.repository }}