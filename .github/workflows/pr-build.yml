name: Build Pull Request

on:
  workflow_call:
    secrets:
      app_secret_key:
        required: true
      app_id:
        required: true
      gpg_private_key:
        required: true
      gpg_passphrase:
        required: true

permissions:
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_secret_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout Local Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout Parent Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: Crazy-Crew/.github
          path: .github

      - uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.gpg_private_key }}
          passphrase: ${{ secrets.gpg_passphrase }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Render template
        id: template
        uses: chuhlomin/render-template@v1.4
        with:
          template: .github/.github/build_finished.md
          vars:
            |
            user: ${{ github.event.pull_request.user.login }}
            logs: ${{ steps.upload-build.outputs.artifact-url }}
            link: ${{ steps.upload-step.outputs.artifact-url }}

      - name: Download Pull Request Number
        uses: actions/download-artifact@v4
        with:
         run-id: ${{ github.event.workflow_run.id }}

      - name: Read Pull Request Number
        id: request_number
        run: |
          echo "number=$(cat request_number.txt)" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          issue-number: ${{ vars.NEXT_BUILD_NUMBER }}
          body: ${{ steps.template.outputs.result }}
          edit-mode: replace