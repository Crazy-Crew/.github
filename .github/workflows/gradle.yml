name: Update Gradle

on:
  workflow_call:
    secrets:
      app_secret_key:
        required: true
      app_id:
        required: true
      gpg_private_key:
        required: true
      gpg_passphrase:
        required: true

permissions:
  contents: write

jobs:
  gradle:
    runs-on: ubuntu-latest

    if: github.repository_owner == 'Crazy-Crew' && github.event_name != 'pull_request'

    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_secret_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.gpg_private_key }}
          passphrase: ${{ secrets.gpg_passphrase }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Update Gradle Wrapper
        run: gradle wrapper --gradle-version latest

      - name: Verify Gradle Wrapper
        run: gradle --help

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          committer: Ryder Belserion <no-reply@ryderbelserion.com>
          sign-commits: true
          commit-message: 'chore: Update Gradle'
          title: 'chore: Update Gradle'
          body: |
            Successfully updated gradle to the newest version!
             - https://docs.gradle.org/current/release-notes.html
          labels: |
            dependencies
          branch: gradle-wrapper-update
          #delete-branch: true
          base: main